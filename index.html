<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow &mdash; Workspace</title>
    <!-- Inter Font (Authentic modern UI font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shell">
        <!-- Top App Navigation / Breadcrumbs -->
        <header class="top-nav">
            <div class="nav-left">
                <div class="workspace-pill">
                    <span class="workspace-dot"></span>
                    <span class="workspace-name">TaskFlow</span>
                    <span class="workspace-sep">/</span>
                    <span class="workspace-view" id="currentViewLabel">All Tasks</span>
                </div>
            </div>

            <div class="nav-right">
                <div class="metrics-chip" id="metricsSummary">
                    <span id="statActive">0</span> active
                    <span class="chip-sep">&bull;</span>
                    <span id="statCompleted">0</span> completed
                    <span class="chip-sep">&bull;</span>
                    <span id="statRate">0%</span>
                </div>

                <div class="header-divider"></div>

                <button class="icon-btn" id="themeToggle" title="Toggle theme (T)" aria-label="Toggle theme">
                    <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>

                <div class="duo-avatars" title="Team: Ahmed Farzdag & Mustafa Altayeb">
                    <span class="avatar-circle">AF</span>
                    <span class="avatar-circle partner">MA</span>
                </div>
            </div>
        </header>

        <!-- Command Strip / Quick-Capture Bar -->
        <section class="capture-container">
            <form id="quickAddForm" class="capture-box">
                <div class="capture-input-row">
                    <span class="capture-plus">+</span>
                    <input type="text" id="taskInput" placeholder="Add task... Press Enter to create" autocomplete="off" required>
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span>Save</span>
                        <kbd class="key-hint">Enter</kbd>
                    </button>
                </div>

                <!-- Inline metadata chips for fast tag / priority picking -->
                <div class="capture-meta-row">
                    <div class="meta-field">
                        <label for="categorySelect">Project:</label>
                        <select id="categorySelect">
                            <option value="General">General</option>
                            <option value="Coursework" selected>Coursework</option>
                            <option value="Development">Development</option>
                            <option value="Personal">Personal</option>
                        </select>
                    </div>

                    <div class="meta-field">
                        <label for="prioritySelect">Priority:</label>
                        <select id="prioritySelect">
                            <option value="none">Normal</option>
                            <option value="medium">Medium</option>
                            <option value="urgent">Urgent</option>
                        </select>
                    </div>

                    <div class="meta-field">
                        <label for="dueDateInput">Due:</label>
                        <input type="date" id="dueDateInput">
                    </div>

                    <div class="meta-field meta-notes-field">
                        <input type="text" id="taskNoteInput" placeholder="Optional brief note...">
                    </div>
                </div>
            </form>
        </section>

        <!-- Control Toolbar: Views, Search, Sorting -->
        <section class="toolbar">
            <div class="segmented-control" id="viewTabs">
                <button class="seg-btn active" data-view="all">
                    All <span class="counter" id="countAll">0</span>
                </button>
                <button class="seg-btn" data-view="active">
                    Active <span class="counter" id="countActive">0</span>
                </button>
                <button class="seg-btn" data-view="urgent">
                    Urgent <span class="counter" id="countUrgent">0</span>
                </button>
                <button class="seg-btn" data-view="completed">
                    Completed <span class="counter" id="countCompleted">0</span>
                </button>
            </div>

            <div class="toolbar-actions">
                <div class="search-wrap">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Filter tasks... (/)" autocomplete="off">
                    <button id="clearSearchBtn" class="clear-btn" style="display: none;">&times;</button>
                </div>

                <select id="sortSelect" class="filter-select">
                    <option value="date-desc">Newest</option>
                    <option value="date-asc">Oldest</option>
                    <option value="due-date">Due date</option>
                    <option value="priority">Priority</option>
                </select>

                <select id="projectFilterSelect" class="filter-select">
                    <option value="all">All Projects</option>
                    <option value="Coursework">Coursework</option>
                    <option value="Development">Development</option>
                    <option value="Personal">Personal</option>
                    <option value="General">General</option>
                </select>

                <button class="clear-done-btn" id="clearDoneBtn" title="Remove completed tasks">
                    Clear Done
                </button>
            </div>
        </section>

        <!-- Task List Area -->
        <main class="list-wrapper">
            <div id="taskList" class="task-rows">
                <!-- Dynamically rendered rows -->
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <p class="empty-title">No matching tasks</p>
                <p class="empty-subtitle">Use the input above to capture what you need to get done.</p>
            </div>
        </main>

        <!-- Minimalist Keyboard Shortcuts & Footer Bar -->
        <footer class="app-footer">
            <div class="shortcuts-row">
                <span class="shortcut-item"><kbd class="kbd">N</kbd> Focus input</span>
                <span class="shortcut-item"><kbd class="kbd">/</kbd> Search</span>
                <span class="shortcut-item"><kbd class="kbd">T</kbd> Toggle theme</span>
                <span class="shortcut-item"><kbd class="kbd">Esc</kbd> Blur</span>
            </div>
            <div class="footer-meta">
                <span>TaskFlow Duo &bull; <strong>Ahmed Farzdag</strong> &amp; <strong>Mustafa Altayeb</strong></span>
                <span class="sep">&bull;</span>
                <span>Branch: <code class="branch-pill">main</code></span>
            </div>
        </footer>
    </div>

    <!-- Notification Toast Element -->
    <div id="toastNotification" class="minimal-toast" role="status"></div>

    <script src="app.js"></script>
</body>
</html>
